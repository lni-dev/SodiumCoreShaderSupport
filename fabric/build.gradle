import net.darkhax.curseforgegradle.TaskPublishCurseForge

plugins {
    id 'multiloader-loader'
    id 'fabric-loom'
    id "com.modrinth.minotaur" version "2.+"
    id 'net.darkhax.curseforgegradle' version '1.1.15'
}

repositories {
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft}:${parchment_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    modImplementation("maven.modrinth:sodium:${project.sodium_version}-fabric")
}

loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    mixin {
        defaultRefmapName.set("${mod_id}.refmap.json")
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}

if(project.hasProperty("modrinthToken")) {
    modrinth {
        token = modrinthToken // Please use an environment variable for this! The default is `$MODRINTH_TOKEN`.
        projectId = 'G8yJPRdl' // The ID of your Modrinth project. Slugs will not work.
        versionNumber = upload_ready_mod_version // The (preferably SemVer) version of the mod. If not specified, it'll use the `version` declaration
        versionName = 'SodiumCoreShaderSupport' // The version title. If not specified, it'll use the version number
        uploadFile = remapJar // Tells Minotaur to use the remapped jar
        gameVersions = supp_mc_versions_fabric // An array of game versions the version supports
        loaders = ['fabric'] // Self-explanatory.
        versionType = scss_release_type
        changelog = mod_changelog
    }

    tasks.register("publishCurseForge", TaskPublishCurseForge) {
        apiToken = curseForgeToken

        def mainFile = upload(956376, remapJar)
        mainFile.releaseType = "${scss_release_type}"
        mainFile.changelog = "${mod_changelog}"
        mainFile.changelogType = 'markdown'
        for (final def v in supp_mc_versions_fabric)
            mainFile.addGameVersion(v)
        mainFile.addGameVersion("fabric")
        mainFile.changelog = 'The changelog string for this file.'
        mainFile.displayName = "Sodium Core Shader Support $minecraft_version $upload_ready_mod_version"
    }

    tasks.register("publish Fabric toModrinthAndCurseForge") {
        dependsOn(tasks.named("modrinth"))
        dependsOn(tasks.named("publishCurseForge"))
    }
}