import net.darkhax.curseforgegradle.TaskPublishCurseForge

plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
    id "com.modrinth.minotaur" version "2.+"
    id 'net.darkhax.curseforgegradle' version '1.1.15'
}

neoForge {
    version = neoforge_version
    // Automatically enable neoforge AccessTransformers if the file exists
    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
    runs {
        configureEach {
            systemProperty('neoforge.enabledGameTestNamespaces', mod_id)
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})" // Unify the run config names with fabric
        }
        client {
            client()
        }
        data {
            clientData()
        }
        server {
            server()
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
}

dependencies {
    implementation("maven.modrinth:sodium:${project.sodium_version}-neoforge")
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

if(project.hasProperty("modrinthToken") && project.hasProperty("curseForgeToken")) {
    modrinth {
        token = modrinthToken // Please use an environment variable for this! The default is `$MODRINTH_TOKEN`.
        projectId = 'G8yJPRdl' // The ID of your Modrinth project. Slugs will not work.
        versionNumber = upload_ready_mod_version // The (preferably SemVer) version of the mod. If not specified, it'll use the `version` declaration
        versionName = 'SodiumCoreShaderSupport' // The version title. If not specified, it'll use the version number
        uploadFile = jar // Tells Minotaur to use the remapped jar
        gameVersions = supp_mc_versions_neoforge // An array of game versions the version supports
        loaders = ['neoforge'] // Self-explanatory.
        versionType = scss_release_type
        changelog = mod_changelog
    }

    tasks.register("publishCurseForge", TaskPublishCurseForge) {
        apiToken = curseForgeToken

        def mainFile = upload(956376, jar)
        mainFile.releaseType = "${scss_release_type}"
        mainFile.changelog = "${mod_changelog}"
        mainFile.changelogType = 'markdown'
        for (final def v in supp_mc_versions_neoforge)
            mainFile.addGameVersion(v)
        mainFile.addGameVersion("neoforge")
        mainFile.changelog = 'The changelog string for this file.'
        mainFile.displayName = "$upload_ready_mod_version-$minecraft_version"
    }

    tasks.register("publish NeoForge toModrinthAndCurseForge") {
        dependsOn(tasks.named("modrinth"))
        dependsOn(tasks.named("publishCurseForge"))
    }
}

